# Perfil DEV / DEMO: base de datos en memoria H2, sin instalar nada.
# MODE=PostgreSQL hace que H2 acepte sintaxis de Postgres (paridad con prod).
spring.datasource.url=jdbc:h2:mem:cosmos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Consola web: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:cosmos)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
