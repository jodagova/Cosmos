spring.application.name=cosmos

# Perfil activo por defecto. Para produccion: -Dspring-boot.run.profiles=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Render (y otros PaaS) inyectan el puerto en la variable PORT
server.port=${PORT:${SERVER_PORT:8080}}

spring.main.banner-mode=off
logging.pattern.dateformat=HH:mm:ss

# En desarrollo sin cache de plantillas; en produccion conviene true
spring.thymeleaf.cache=false

# Credenciales del usuario administrador que se crea al primer arranque
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:cambiar123}

# Subida de archivos (imagenes de productos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Correo (opcional) - definir por variables de entorno en produccion
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
