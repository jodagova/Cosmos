<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<!-- HEAD -->
<head th:fragment="head">
    <title>Cosmos · Cafe Bar</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link rel="icon" type="image/png" sizes="64x64" th:href="@{/img/favicon.png}"/>
    <link rel="apple-touch-icon" th:href="@{/img/favicon.png}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<!-- HEADER -->
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-cosmos">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <span class="logo-badge brand-logo" role="img" aria-label="Cosmos"></span>
                <span class="brand-nombre">COSMOS</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/menu}">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}">Administracion</a>
                    </li>
                </ul>
                <ul class="navbar-nav align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="https://www.instagram.com/cosmos.cafebar/" target="_blank" rel="noopener">
                            <i class="fa-brands fa-instagram"></i>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}"><i class="fa-solid fa-right-to-bracket"></i></a>
                    </li>
                    <li class="nav-item d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                        <span class="navbar-text small"><i class="fa-solid fa-user"></i>
                            <span sec:authentication="name"></span></span>
                        <form method="post" th:action="@{/logout}">
                            <button class="btn btn-sm btn-outline-light" type="submit">Salir</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- FOOTER -->
<footer th:fragment="footer" class="footer-cosmos mt-5 py-4">
    <div class="container">
        <div class="row gy-3 align-items-start">
            <div class="col-md-4">
                <span class="logo-badge brand-logo mb-2" role="img" aria-label="Cosmos"></span>
                <p class="small mb-0" th:text="#{app.eslogan}">Bebidas de otro planeta</p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold text-white">Donde estamos</h6>
                <p class="small mb-1"><i class="fa-solid fa-location-dot me-1"></i> Edificio Centro Colon, Paseo Colon, San Jose</p>
                <p class="small mb-0">
                    <i class="fa-brands fa-instagram me-1"></i>
                    <a href="https://www.instagram.com/cosmos.cafebar/" target="_blank" rel="noopener">@cosmos.cafebar</a>
                </p>
            </div>
            <div class="col-md-4">
                <h6 class="fw-bold text-white">Horario</h6>
                <p class="small mb-0">Lunes a domingo</p>
                <p class="small mb-0">9:00 a.m. &ndash; 6:00 p.m.</p>
            </div>
        </div>
        <hr class="border-secondary">
        <p class="text-center small mb-0">&copy; 2026 Cosmos Cafe Bar · San Jose, Costa Rica</p>
    </div>
</footer>

</html>
