<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container my-5" style="max-width: 420px;">
    <h1 class="h4 text-center mb-4">Iniciar sesion</h1>

    <div class="alert alert-danger" th:if="${param.error}">Usuario o contrasena incorrectos.</div>
    <div class="alert alert-success" th:if="${param.logout}">Sesion finalizada.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-cosmos">Ingresar</button>
        </div>
    </form>
</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
