<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<main class="container my-5">
    <h1 class="h3 mb-4" th:text="#{menu.titulo}">Menu</h1>

    <form class="row g-2 mb-4" method="get" th:action="@{/menu}">
        <div class="col-sm-8 col-md-6">
            <input type="text" name="q" class="form-control" th:value="${q}"
                   th:placeholder="#{menu.buscar}"/>
        </div>
        <div class="col-auto">
            <button class="btn btn-cosmos" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </form>

    <div class="mb-4">
        <a class="btn btn-sm btn-outline-secondary me-1 mb-1" th:href="@{/menu}" th:text="#{menu.todos}">Todos</a>
        <a class="btn btn-sm btn-outline-secondary me-1 mb-1" th:each="c : ${categorias}"
           th:href="@{'/menu/categoria/' + ${c.idCategoria}}" th:text="${c.descripcion}">Categoria</a>
    </div>

    <h2 class="h5 text-muted mb-3" th:if="${categoriaActual != null}" th:text="${categoriaActual.descripcion}">Categoria</h2>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4" th:each="p : ${productos}">
            <div class="card h-100 producto-card">
                <img th:if="${p.rutaImagen != null}" th:src="@{${p.rutaImagen}}" class="card-img-top" alt=""/>
                <div class="card-body d-flex flex-column">
                    <h3 class="h5" th:text="${p.nombre}">Producto</h3>
                    <p class="text-muted small flex-grow-1" th:text="${p.descripcion}">Descripcion</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold text-cosmos" th:if="${p.precio != null}">
                            &#8353; <span th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 0, 'POINT')}">0</span>
                        </span>
                        <span class="badge badge-bajopedido" th:unless="${p.precio != null}"
                              th:text="#{menu.bajopedido}">Bajo pedido</span>
                        <span class="badge text-bg-light" th:if="${p.categoria != null}"
                              th:text="${p.categoria.descripcion}">Categoria</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(productos)}">
            <p class="text-muted">No se encontraron productos.</p>
        </div>
    </div>

    <p class="text-muted small mt-4">
        Precios en colones. Menu de ejemplo &mdash; pendiente de reemplazar por el del cliente.
    </p>
</main>

<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body>
</html>
