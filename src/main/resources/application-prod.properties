# Perfil PROD: PostgreSQL (Neon en la nube, o Postgres local via docker-compose).
# Definir las variables de entorno antes de arrancar:
#   DB_URL       ej: jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/cosmos?sslmode=require
#   DB_USERNAME
#   DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cosmos}
spring.datasource.username=${DB_USERNAME:cosmos}
spring.datasource.password=${DB_PASSWORD:cosmos}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate detecta el dialecto de Postgres automaticamente.
# 'update' crea/ajusta las tablas al arrancar; para control estricto usar db/schema.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=true
